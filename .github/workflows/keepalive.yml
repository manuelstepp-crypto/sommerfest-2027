name: Supabase wach halten

# Supabase pausiert kostenlose Projekte nach 7 Tagen ohne Zugriff.
# Dieser Ping liest einmal pro Woche eine harmlose Tabelle, damit das Formular nicht ins Leere läuft.
on:
  schedule:
    - cron: "0 6 * * 1,4"   # Montag + Donnerstag 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Heartbeat lesen
        run: |
          curl --fail --silent --show-error \
            "https://stomqsjexvocbegwzkgy.supabase.co/rest/v1/heartbeat?select=id,note" \
            -H "apikey: sb_publishable_4UigCPskAjYZ-0CryLYUeQ_GfMR9IGQ" \
            -H "Authorization: Bearer sb_publishable_4UigCPskAjYZ-0CryLYUeQ_GfMR9IGQ"
